<style>

:root{

  --map-lo:#D9654B; --map-mid:#2B3236; --map-hi:#3E9CCB;
  --good:#3CC7B4; --ok:#9BC34A; --warn:#F2B53A; --bad:#FF6A50; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1417; --surface:#141C20; --sunk:#0A0F12; --ink:#E2E8EB; --muted:#93A2AB; --line:#2A363C; --grid:#1B252A; --grid-major:#2A363D;
  --accent:#7D93FF; --accent-ink:#0E1417;

  --map-lo:#D9654B; --map-mid:#2B3236; --map-hi:#3E9CCB;

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:24px;letter-spacing:.01em;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
select.btn{padding-right:24px}
.lbl{font-family:var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:600}
.menu{position:relative}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:6px;display:grid;gap:2px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.menu .pop button,.menu .pop label{text-align:left;border:0;background:none;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:13px}
.menu .pop button:hover,.menu .pop label:hover{background:var(--sunk)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding-top:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.views{min-width:0;display:grid;gap:10px}
.toolstrip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg.tools button{display:inline-flex;gap:6px;align-items:center}
.kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.6}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;color:var(--muted)}
.chk input{accent-color:var(--accent)}
.view{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 6px;min-width:0}
.view figcaption{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.view figcaption .mono{font-size:11.5px;color:var(--muted)}
.view canvas{display:block;touch-action:none;max-width:100%}
.hint{font-size:12px;color:var(--muted)}
.legendrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12px;color:var(--muted)}
.cbar{display:flex;align-items:center;gap:8px}
.cbar canvas{width:180px;height:10px;border-radius:2px;border:1px solid var(--line)}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:18px;height:0;border-top:2px solid}

/* panel */
.panel{display:grid;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h2{margin:0 0 10px;font-family:var(--f-display);font-stretch:80%;font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.hero .big{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;font-weight:600;margin-left:3px}
.hero .what{font-size:12px;color:var(--muted);margin-top:4px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--sunk);border-radius:4px;padding:6px 8px;min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:600}
.kpi span{font-size:11px;color:var(--muted)}
#rgram{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto;max-height:220px;overflow-y:auto;margin-top:8px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 4px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{display:grid;gap:3px;min-width:0}
.f span{font-size:11px;color:var(--muted)}
.f input,.f select{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 7px;font-family:var(--f-mono);font-size:13px}
.f.wide{grid-column:1/-1}
.f select{font-family:var(--f-body)}
.srcrow{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr)) 28px;gap:6px;align-items:end;margin-bottom:6px}
.srcrow .tag{font-family:var(--f-mono);font-weight:600;color:var(--source);padding-bottom:6px}
.iconbtn{border:1px solid var(--line);background:none;border-radius:4px;height:30px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}
.alpha{display:flex;gap:10px;align-items:center}
.alpha input[type=range]{flex:1;accent-color:var(--accent)}
.empty{color:var(--muted);font-size:13px;margin:0}
details.model summary{cursor:pointer;font-family:var(--f-display);font-stretch:80%;font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
details.model p,details.model li{font-size:13px;color:var(--muted);max-width:65ch}
details.model .eq{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);background:var(--sunk);padding:6px 8px;border-radius:4px;overflow-x:auto;white-space:nowrap}
.credit{font-size:12px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r);font-size:13px;z-index:50;max-width:calc(100% - 32px)}
textarea.json{width:100%;height:140px;font-family:var(--f-mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="8" cy="17" r="3.2" fill="var(--source)"/><path d="M14 9a11 11 0 0 1 0 16M19 5a16 16 0 0 1 0 24M24 1.5a21 21 0 0 1 0 31" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
    <div><h1>Echogram</h1><p data-i18n="tagline">Akustyka pomieszczeń metodą źródeł pozornych</p></div>
  </div>
  <div class="ctrls">
    <select id="preset" class="btn" aria-label="Preset"></select>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mSpeech" aria-pressed="true" data-i18n="speech">Mowa · C50</button>
      <button id="mMusic" aria-pressed="false" data-i18n="music">Muzyka · C80</button>
    </div>
    <button class="btn" id="undo" title="Ctrl+Z" data-i18n="undo">Cofnij</button>
    <details class="menu" id="projMenu">
      <summary class="btn" data-i18n="project">Projekt</summary>
      <div class="pop">
        <button id="copyJson" data-i18n="copyJson">Kopiuj projekt jako JSON</button>
        <label for="fileIn" data-i18n="loadFile">Wczytaj plik (.json lub .pak z 2023)</label>
        <button id="pasteJson" data-i18n="pasteJson">Wklej JSON…</button>
        <button id="resetBtn" data-i18n="reset">Przywróć przykład</button>
      </div>
    </details>
    <input type="file" id="fileIn" accept=".json,.pak,.txt" hidden>
    <div class="seg" role="group" aria-label="Language"><button id="lPL" aria-pressed="true">PL</button><button id="lEN" aria-pressed="false">EN</button></div>
  </div>
</header>

<main class="layout">
  <section class="views">
    <div class="toolstrip">
      <div class="seg tools" role="group" aria-label="Tools">
        <button id="tSelect" aria-pressed="true"><span data-i18n="tSelect">Zaznacz</span><span class="kbd">V</span></button>
        <button id="tWall" aria-pressed="false"><span data-i18n="tWall">Ściana</span><span class="kbd">W</span></button>
        <button id="tSource" aria-pressed="false"><span data-i18n="tSource">Źródło</span><span class="kbd">S</span></button>
      </div>
      <div class="seg" role="group" aria-label="Map">
        <button id="mapC" aria-pressed="true" data-i18n="mapC">Mapa klarowności</button>
        <button id="mapS" aria-pressed="false" data-i18n="mapS">Mapa SPL</button>
        <button id="mapOff" aria-pressed="false" data-i18n="mapOff">Bez mapy</button>
      </div>
      <label class="chk"><input type="checkbox" id="showRays" checked> <span data-i18n="rays">Promienie</span></label>
      <label class="chk"><input type="checkbox" id="showImg"> <span data-i18n="images">Źródła pozorne</span></label>
    </div>
    <figure class="view">
      <figcaption><span class="lbl" data-i18n="plan" title="m">Rzut poziomy · x–y</span><span class="mono" id="readPlan"></span></figcaption>
      <canvas id="plan"></canvas>
    </figure>
    <figure class="view">
      <figcaption><span class="lbl" data-i18n="section">Przekrój podłużny · x–z</span><span class="mono" id="readSec"></span></figcaption>
      <canvas id="sec"></canvas>
    </figure>
    <div class="legendrow">
      <div class="cbar"><span id="cbarLo" class="mono"></span><canvas id="cbar" width="180" height="10"></canvas><span id="cbarHi" class="mono"></span><span id="cbarName"></span></div>
      <span class="key"><i style="border-color:var(--ink)"></i><span data-i18n="kDirect">bezpośredni</span></span>
      <span class="key"><i style="border-color:var(--early)"></i><span data-i18n="kEarly">odbicie użyteczne</span></span>
      <span class="key"><i style="border-color:var(--echo)"></i><span data-i18n="kEcho">echo</span></span>
      <span class="key"><i style="border-color:var(--late);border-top-style:dashed"></i><span data-i18n="kLate">późne, słabe</span></span>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <aside class="panel">
    <div class="card" id="analysis">
      <h2><span data-i18n="pointTitle">Punkt odbioru</span><span class="mono lbl" id="recPos"></span></h2>
      <div class="hero">
        <div><div class="big" id="bigC">–</div><div class="what" id="bigWhat"></div></div>
        <span class="chip" id="rating"></span>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kSpl">–</b><span data-i18n="kpiSpl">SPL, dB</span></div>
        <div class="kpi"><b id="kRt">–</b><span data-i18n="kpiRt">T60 Sabine, s</span></div>
        <div class="kpi"><b id="kEcho">–</b><span data-i18n="kpiEcho">echa</span></div>
      </div>
      <svg id="rgram" viewBox="0 0 330 150" role="img" aria-label="Reflectogram"></svg>
      <div class="tablewrap"><table><thead><tr><th data-i18n="thPath">Droga</th><th class="n">Δt ms</th><th class="n">ΔL dB</th><th data-i18n="thStatus">Ocena</th></tr></thead><tbody id="arrTable"></tbody></table></div>
    </div>

    <div class="card" id="selCard" hidden>
      <h2><span data-i18n="surface">Powierzchnia</span><button class="btn danger" id="delSel" data-i18n="delete">Usuń</button></h2>
      <div class="fields">
        <label class="f wide"><span data-i18n="name">Nazwa</span><input id="sName" type="text"></label>
        <label class="f wide"><span data-i18n="material">Materiał</span><select id="sMat"></select></label>
        <div class="f wide"><span data-i18n="alpha">Współczynnik pochłaniania α</span>
          <div class="alpha"><input type="range" id="sAlpha" min="0" max="1" step="0.01"><span class="mono" id="sAlphaV"></span></div></div>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="sources">Źródła dźwięku</span><button class="btn" id="addSrc" data-i18n="add">Dodaj</button></h2>
      <div id="srcList"></div>
      <h2 style="margin-top:12px"><span data-i18n="receiver">Odbiornik</span></h2>
      <div class="fields">
        <label class="f"><span>x, m</span><input id="rX" type="number" step="0.1"></label>
        <label class="f"><span>y, m</span><input id="rY" type="number" step="0.1"></label>
        <label class="f"><span data-i18n="hEar">h ucha, m</span><input id="rZ" type="number" step="0.1"></label>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="room">Pomieszczenie</span><span class="mono lbl" id="volume"></span></h2>
      <div class="fields">
        <label class="f"><span data-i18n="len">długość x, m</span><input id="dL" type="number" min="3" max="200" step="1"></label>
        <label class="f"><span data-i18n="wid">szerokość y, m</span><input id="dW" type="number" min="3" max="200" step="1"></label>
        <label class="f"><span data-i18n="hei">wysokość z, m</span><input id="dH" type="number" min="2" max="80" step="0.5"></label>
      </div>
    </div>

    <details class="card model">
      <summary data-i18n="modelTitle">Model obliczeniowy</summary>
      <div id="modelBody"></div>
    </details>
    <p class="credit" data-i18n="credit"></p>
  </aside>
</main>

model:`<p>Program śledzi drogę dźwięku od każdego źródła do odbiornika: falę bezpośrednią i odbicia pierwszego rzędu od każdej ściany (rzut) oraz od podłogi, sufitu i reflektorów (przekrój). Odbicie wyznacza <b>źródło pozorne</b> — lustrzane odbicie źródła względem płaszczyzny. Odbicie liczy się tylko wtedy, gdy punkt odbicia leży na ścianie i żadna inna przegroda nie zasłania drogi.</p>

<p>Energię dzielimy na wczesną (dociera w ciągu t₀ od pierwszego dźwięku: 50 ms dla mowy, 80 ms dla muzyki) i późną. Późna to odbicia spóźnione oraz pogłos statystyczny wg zrewidowanej teorii Barrona, z czasem pogłosu Sabine’a T = 0,161·V / Σαᵢ·Sᵢ.</p>

<p>Odbicie spóźnione o więcej niż t₀ i słabsze od najsilniejszego dźwięku o mniej niż 10 dB oznaczamy jako echo. Model jest geometryczny i pasmowo uśredniony (α dla ok. 500–1000 Hz), nadaje się do szybkiej oceny wariantów, a nie do odbioru akustycznego sali.</p>`},

<p>Energy is split into early (arriving within t₀ of the first sound: 50 ms for speech, 80 ms for music) and late. Late energy is the delayed reflections plus a statistical reverberant tail from Barron's revised theory, using the Sabine reverberation time T = 0.161·V / Σαᵢ·Sᵢ.</p>

let lang="pl";
const t=k=>(T[lang][k]??T.pl[k]??k);

/* ---------------- materials ---------------- */
const MATS=[
 ["concrete",0.02,"Beton","Concrete"],["brick",0.03,"Cegła tynkowana","Plastered brick"],["glass",0.04,"Szkło","Glass"],
 ["plaster",0.05,"Płyta g-k","Plasterboard"],["parquet",0.07,"Parkiet","Wood floor"],["wood",0.10,"Boazeria drewniana","Wood panelling"],
 ["carpet",0.30,"Wykładzina","Carpet"],["curtain",0.50,"Ciężkie zasłony","Heavy curtains"],["panel",0.80,"Panele akustyczne","Acoustic panels"],
 ["audience",0.85,"Widownia z publicznością","Occupied seating"],["open",1.00,"Otwór / brak odbicia","Opening / no reflection"]];
const matName=id=>{const m=MATS.find(m=>m[0]===id);return m?(lang==="pl"?m[2]:m[3]):t("custom")};

/* ---------------- geometry ---------------- */
const C_AIR=343;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], cross=(a,b)=>a[0]*b[1]-a[1]*b[0], dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const len2=v=>v[0]*v[0]+v[1]*v[1];
function mirror(p,a,b){const ab=sub(b,a),k=dot(sub(p,a),ab)/len2(ab);const f=[a[0]+ab[0]*k,a[1]+ab[1]*k];return [2*f[0]-p[0],2*f[1]-p[1]]}
function segX(p1,p2,p3,p4){const r=sub(p2,p1),s=sub(p4,p3),den=cross(r,s);if(Math.abs(den)<1e-12)return null;
  const q=sub(p3,p1),tt=cross(q,s)/den,u=cross(q,r)/den;if(tt<-1e-9||tt>1+1e-9||u<-1e-9||u>1+1e-9)return null;return{t:tt,u}}
function crosses(p,q,w){const h=segX(p,q,w.a,w.b);return !!h&&h.t>1e-4&&h.t<1-1e-4}
function blocked(p,q,walls,skip){for(const w of walls){if(w!==skip&&crosses(p,q,w))return true}return false}
function reflect(S,R,w,walls){
  const ab=sub(w.b,w.a);if(len2(ab)<1e-6)return null;
  const sS=cross(ab,sub(S,w.a)),sR=cross(ab,sub(R,w.a));if(sS*sR<=1e-9)return null;
  const I=mirror(S,w.a,w.b),h=segX(I,R,w.a,w.b);if(!h)return null;
  const P=[I[0]+(R[0]-I[0])*h.t,I[1]+(R[1]-I[1])*h.t];
  if(blocked(S,P,walls,w)||blocked(P,R,walls,w))return null;
  return{I,P,len:Math.sqrt(len2(sub(R,I)))}}
function distSeg(p,a,b){const ab=sub(b,a),L=len2(ab);let k=L?dot(sub(p,a),ab)/L:0;k=Math.max(0,Math.min(1,k));return Math.hypot(p[0]-a[0]-ab[0]*k,p[1]-a[1]-ab[1]*k)}

function W(a,b,mat,name,alpha){const m=MATS.find(m=>m[0]===mat);return{id:uid("w"),a,b,mat,name:name||"",alpha:alpha??(m?m[1]:0.05)}}
function rectPreset(){const L=30,Wd=20,H=10;return{name:"rect",room:{L,W:Wd,H},mode:"speech",

function rotundaPreset(){const Wd=24,L=24,H=12,cx=12,cy=12,r=11,n=18,plan=[];
  for(let i=0;i<n;i++){const a0=i/n*2*Math.PI,a1=(i+1)/n*2*Math.PI;
    plan.push(W([+(cx+r*Math.cos(a0)).toFixed(3),+(cy+r*Math.sin(a0)).toFixed(3)],[+(cx+r*Math.cos(a1)).toFixed(3),+(cy+r*Math.sin(a1)).toFixed(3)],"brick",(lang==="pl"?"Segment ":"Segment ")+(i+1)))}
  return{name:"rotunda",room:{L,W:Wd,H},mode:"speech",plan,
  sec:[W([0,0],[L,0],"parquet","Podłoga / Floor"),W([0,H],[L,H],"plaster","Sufit / Ceiling")],

const PAK111="20 20 7\n1 38 38 721 38\n1 721 38 721 721\n1 721 721 37 721\n0 37 722 37 34\nProjection 2\n5 38 37 721 37";
const PAK222="30 20 10\n1 83 54 161 352\n1 161 352 682 367\n1 682 367 675 62\n1 675 63 66 60\nProjection 2";
function parsePak(txt){
  const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const [L,Wd,H]=lines[0].split(/\s+/).map(Number);
  if(!(L>0&&Wd>0&&H>0))throw new Error("bad");
  const a=[],b=[];let cur=a;for(const ln of lines.slice(1)){if(/^projection/i.test(ln)){cur=b;continue}const v=ln.split(/\s+/).map(Number);if(v.length===5&&v.every(isFinite))cur.push(v)}
  const kOf=(rows,D)=>{let mx=0,my=0;for(const r of rows){mx=Math.max(mx,r[1],r[3]);my=Math.max(my,r[2],r[4])}return Math.max(mx/L,my/D,1)};
  const k1=kOf(a,Wd),k2=b.length?kOf(b,H):k1;const r1=v=>Math.round(v*100)/100;
  const conv=(r,k,D,i,pre)=>{const al=r[0]===0?1:r[0]/10;return{id:uid("w"),a:[r1(r[1]/k),r1(D-r[2]/k)],b:[r1(r[3]/k),r1(D-r[4]/k)],mat:"",alpha:al,name:pre+" "+(i+1)}};
  const plan=a.map((r,i)=>conv(r,k1,Wd,i,t("wallN")));const sec=b.map((r,i)=>conv(r,k2,H,i,t("wallN")+" z"));
  if(!sec.length)sec.push(W([0,0],[L,0],"audience","Podłoga / Floor"));
  return{p:{name:"pak",room:{L,W:Wd,H},mode:"speech",plan,sec,sources:[{id:uid("s"),x:Math.max(1,Math.floor(L/10)),y:Wd/2,z:1.6,level:70}],rec:{x:L/2,y:Wd/2,z:1.2}},k:k1}}
const PRESETS=[

 ["rotunda","Rotunda Ø22 m (ogniskowanie)","Rotunda Ø22 m (focusing)",rotundaPreset],

 ["pak222","Projekt z 2023: 222.pak (trapez)","2023 project: 222.pak (trapezoid)",()=>parsePak(PAK222).p]];

let P;let hist=[],sel=null,tool="select",metric="clarity",showRays=true,showImg=false;
const clone=o=>JSON.parse(JSON.stringify(o));
function commit(){hist.push(clone(P));if(hist.length>80)hist.shift();save();fieldDirty=true;schedule()}
function save(){try{localStorage.setItem("echogram.project",JSON.stringify(P));localStorage.setItem("echogram.lang",lang)}catch(e){}}
function validProject(p){return p&&p.room&&p.room.L>0&&p.room.W>0&&p.room.H>0&&Array.isArray(p.plan)&&Array.isArray(p.sec)&&Array.isArray(p.sources)&&p.sources.length&&p.rec}

/* ---------------- acoustics ---------------- */
function roomStats(){
  const {L,W:Wd,H}=P.room;let area=L*Wd;
  // plan area if walls form a closed loop
  const segs=P.plan.map(w=>[w.a,w.b]);const near=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1])<0.05;
  if(segs.length>=3){const used=new Set([0]);const poly=[segs[0][0],segs[0][1]];let ok=true;
    while(used.size<segs.length){const last=poly[poly.length-1];let found=-1,rev=false;
      for(let i=0;i<segs.length;i++){if(used.has(i))continue;if(near(segs[i][0],last)){found=i;break}if(near(segs[i][1],last)){found=i;rev=true;break}}
      if(found<0){ok=false;break}used.add(found);poly.push(rev?segs[found][0]:segs[found][1])}
    if(ok&&near(poly[0],poly[poly.length-1])){let s=0;for(let i=0;i<poly.length-1;i++)s+=cross(poly[i],poly[i+1]);if(Math.abs(s/2)>1)area=Math.abs(s/2)}}
  const V=area*H,effW=area/L;let A=0;
  for(const w of P.plan)A+=w.alpha*Math.sqrt(len2(sub(w.b,w.a)))*H;
  for(const w of P.sec)A+=w.alpha*Math.sqrt(len2(sub(w.b,w.a)))*effW;
  const T60=Math.min(12,Math.max(0.1,0.161*V/Math.max(A,1)));return{V,A,T60,area}}

function arrivals(rx,ry,rz,geom){
  const out=[],R2p=[rx,ry],R2s=[rx,rz];
  for(const s of P.sources){
    const E0=Math.pow(10,s.level/10),Sp=[s.x,s.y],Ss=[s.x,s.z];
    const d=Math.max(0.3,Math.hypot(s.x-rx,s.y-ry,s.z-rz));
    if(!blocked(Sp,R2p,P.plan,null)&&!blocked(Ss,R2s,P.sec,null))out.push({t:d/C_AIR,E:E0/(d*d),kind:"direct",src:s,d});
    const dz=s.z-rz,dy=s.y-ry;
    for(const w of P.plan){if(w.alpha>=0.999)continue;const r=reflect(Sp,R2p,w,P.plan);if(!r)continue;
      const dd=Math.max(0.3,Math.hypot(r.len,dz));out.push({t:dd/C_AIR,E:E0*(1-w.alpha)/(dd*dd),kind:"refl",view:"plan",wall:w,src:s,d:dd,I:geom?r.I:null,Pt:geom?r.P:null})}
    for(const w of P.sec){if(w.alpha>=0.999)continue;const r=reflect(Ss,R2s,w,P.sec);if(!r)continue;
      const dd=Math.max(0.3,Math.hypot(r.len,dy));out.push({t:dd/C_AIR,E:E0*(1-w.alpha)/(dd*dd),kind:"refl",view:"sec",wall:w,src:s,d:dd,I:geom?r.I:null,Pt:geom?r.P:null})}
  }
  return out}

function metrics(arr,rx,ry,rz,st){
  const t0=P.mode==="music"?0.08:0.05;
  if(!arr.length){return null}
  let tref=Infinity,Emax=0;for(const a of arr){if(a.t<tref)tref=a.t;if(a.E>Emax)Emax=a.E}
  let early=0,late=0,echoes=0;const Lmax=10*Math.log10(Emax);
  for(const a of arr){a.dt=a.t-tref;a.dL=10*Math.log10(a.E)-Lmax;
    if(a.dt<=t0){early+=a.E;a.status=a.kind==="direct"?"direct":"useful"}
    else{late+=a.E;if(a.dL>=-10){a.status="echo";echoes++}else a.status="late"}}
  const {T60,V}=st;let rev=0;
  for(const s of P.sources){const r=Math.max(0.3,Math.hypot(s.x-rx,s.y-ry,s.z-rz));const E0=Math.pow(10,s.level/10);
    const tl=Math.max(0,tref+t0-r/C_AIR);rev+=E0/100*(31200*T60/V)*Math.exp(-0.04*r/T60)*Math.exp(-13.82*tl/T60)}
  late+=rev;
  const C=Math.max(-20,Math.min(20,10*Math.log10(Math.max(early,1e-12)/late)));
  return{C,spl:10*Math.log10(early+late),echoes,t0,tref,rev}}

function rating(C){
  if(P.mode==="speech"){if(C>=2)return["rExc","good"];if(C>=0)return["rGood","ok"];if(C>=-3)return["rFair","warn"];return["rPoor","bad"]}
  if(C>4)return["rDry","warn"];if(C>=-2)return["rOpt","good"];if(C>=-5)return["rFair","warn"];return["rWet","bad"]}

/* ---------------- field ---------------- */
let field=null,fieldDirty=true;
function niceStep(L){const v=L/70;for(const s of [0.1,0.2,0.25,0.5,1,2])if(s>=v)return s;return 2}
function computeField(){
  const {L,W:Wd}=P.room,step=niceStep(Math.max(L,Wd)),nx=Math.ceil(L/step),ny=Math.ceil(Wd/step),st=roomStats();
  const inside=new Uint8Array(nx*ny),q=[];const ctr=(i,j)=>[Math.min(L,(i+.5)*step),Math.min(Wd,(j+.5)*step)];
  for(const s of P.sources){const i=Math.min(nx-1,Math.max(0,Math.floor(s.x/step))),j=Math.min(ny-1,Math.max(0,Math.floor(s.y/step)));if(!inside[j*nx+i]){inside[j*nx+i]=1;q.push(i,j)}}
  while(q.length){const j=q.pop(),i=q.pop(),c=ctr(i,j);
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=i+di,b=j+dj;if(a<0||b<0||a>=nx||b>=ny||inside[b*nx+a])continue;
      if(!blocked(c,ctr(a,b),P.plan,null)){inside[b*nx+a]=1;q.push(a,b)}}}
  const C=new Float32Array(nx*ny).fill(NaN),S=new Float32Array(nx*ny).fill(NaN);let smin=Infinity,smax=-Infinity;
  const rz=P.rec.z;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){if(!inside[j*nx+i])continue;const [x,y]=ctr(i,j);const arr=arrivals(x,y,rz,false);const m=metrics(arr,x,y,rz,st);
    if(!m)continue;C[j*nx+i]=m.C;S[j*nx+i]=m.spl;if(m.spl<smin)smin=m.spl;if(m.spl>smax)smax=m.spl}
  field={nx,ny,step,C,S,smin,smax};fieldDirty=false;fieldImg=null}
let fieldImg=null;
function hex2rgb(h){h=h.trim();if(h.startsWith("#")){const n=h.length===4?h.slice(1).split("").map(c=>c+c).join(""):h.slice(1);return[parseInt(n.slice(0,2),16),parseInt(n.slice(2,4),16),parseInt(n.slice(4,6),16)]}return[128,128,128]}
const lerp=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
function colorFor(v){
  if(metric==="clarity"){const k=Math.max(-1,Math.min(1,v/10));return k<0?lerp(COL.mid,COL.lo,-k):lerp(COL.mid,COL.hi,k)}
  const k=field.smax>field.smin?(v-field.smin)/(field.smax-field.smin):0.5;return lerp(COL.mid,COL.hi,Math.max(0,Math.min(1,k)))}
function buildFieldImg(){
  if(!field||metric==="off"){fieldImg=null;return}
  const {nx,ny}=field,cv=document.createElement("canvas");cv.width=nx;cv.height=ny;const cx=cv.getContext("2d"),img=cx.createImageData(nx,ny);
  const arr=metric==="clarity"?field.C:field.S;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=arr[j*nx+i],o=((ny-1-j)*nx+i)*4;if(isNaN(v)){img.data[o+3]=0;continue}
    const c=colorFor(v);img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=235}
  cx.putImageData(img,0,0);fieldImg=cv}
function fieldAt(x,y){if(!field||metric==="off")return null;const i=Math.floor(x/field.step),j=Math.floor(y/field.step);if(i<0||j<0||i>=field.nx||j>=field.ny)return null;
  const v=(metric==="clarity"?field.C:field.S)[j*field.nx+i];return isNaN(v)?null:v}

  COL={paper:g("--paper"),surface:g("--surface"),ink:g("--ink"),muted:g("--muted"),line:g("--line"),grid:g("--grid"),gridM:g("--grid-major"),accent:g("--accent"),
    early:g("--early"),echo:g("--echo"),late:g("--late"),source:g("--source"),receiver:g("--receiver"),
    lo:hex2rgb(g("--map-lo")),mid:hex2rgb(g("--map-mid")),hi:hex2rgb(g("--map-hi")),good:g("--good"),ok:g("--ok"),warn:g("--warn"),bad:g("--bad")};

/* ---------------- views ---------------- */
const PAD={l:30,r:10,t:10,b:22};let SCALE=20;
class View{
  constructor(cv,kind){this.cv=cv;this.kind=kind;this.ctx=cv.getContext("2d");this.drag=null;this.draw0=null;this.hover=null;

const vPlan=new View(document.getElementById("plan"),"plan"),vSec=new View(document.getElementById("sec"),"sec");

function layout(){const host=document.querySelector(".views").clientWidth-22;const {L,W:Wd,H}=P.room;

/* ---------------- render loop ---------------- */
let raf=0,an=null;
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){raf=0;if(fieldDirty&&metric!=="off")computeField();
  const st=roomStats(),arr=arrivals(P.rec.x,P.rec.y,P.rec.z,true),m=metrics(arr,P.rec.x,P.rec.y,P.rec.z,st);
  an={arr,m,st};vPlan.render(an);vSec.render(an);renderAnalysis();renderLegend()}

function fmt(v,d=1){return (v<0?"−":"")+Math.abs(v).toFixed(d).replace(".",lang==="pl"?",":".")}

  if(v.kind==="plan"){const f=fieldAt(p[0],p[1]);if(f!=null)s+=`   ${metric==="clarity"?(P.mode==="music"?"C80":"C50"):"SPL"} ${fmt(f)} dB`}el.textContent=s}

/* ---------------- panel ---------------- */
const $=id=>document.getElementById(id);
function renderAnalysis(){
  const {arr,m,st}=an;$("recPos").textContent=`${fmt(P.rec.x)} · ${fmt(P.rec.y)} · ${fmt(P.rec.z)} m`;
  $("kRt").textContent=fmt(st.T60,2);$("volume").textContent=`V ≈ ${Math.round(st.V).toLocaleString(lang)} m³`;
  if(!m){$("bigC").textContent="–";$("bigWhat").textContent=t("noSound");$("rating").textContent="";$("kSpl").textContent="–";$("kEcho").textContent="–";$("arrTable").innerHTML="";$("rgram").innerHTML="";return}
  $("bigC").innerHTML=`${fmt(m.C)}<small>dB</small>`;$("bigWhat").textContent=P.mode==="music"?t("clarityM"):t("clarityS");
  const [rk,rc]=rating(m.C);const chip=$("rating");chip.textContent=t(rk);chip.style.color=COL[rc];
  $("kSpl").textContent=fmt(m.spl);$("kEcho").textContent=m.echoes;$("kEcho").style.color=m.echoes?COL.echo:"";
  // table
  const sorted=[...arr].sort((a,b)=>a.t-b.t);const multi=P.sources.length>1;
  $("arrTable").innerHTML=sorted.map(a=>{const si=P.sources.indexOf(a.src)+1;const nm=a.kind==="direct"?t("direct"):(a.wall.name||t("wallN"));
    const col=a.status==="echo"?COL.echo:a.status==="late"?COL.late:a.kind==="direct"?COL.ink:COL.early;
    const lab=a.status==="direct"?"—":t(a.status);
    return `<tr><td><span class="dot" style="background:${col}"></span>${multi?"S"+si+" · ":""}${esc(shortName(nm))}</td><td class="n">${Math.round(a.dt*1000)}</td><td class="n">${fmt(a.dL)}</td><td style="color:${col}">${lab}</td></tr>`}).join("");

function drawGram(sorted,m){

  const X=tt=>l+(tt/tmax)*(Wd-l-r),Y=d=>tp+(Math.max(dbmin,d)/dbmin)*(H-tp-b);let s="";
  s+=`<rect x="${X(0)}" y="${tp}" width="${X(m.t0)-X(0)}" height="${H-tp-b}" fill="${COL.early}" opacity="0.1"/>`;
  s+=`<text x="${X(m.t0)-3}" y="${tp+10}" text-anchor="end" font-size="9" fill="${COL.early}" font-family="var(--f-mono)">t₀ ${Math.round(m.t0*1000)} ms</text>`;
  for(let d=0;d>=dbmin;d-=10){s+=`<line x1="${l}" x2="${Wd-r}" y1="${Y(d)}" y2="${Y(d)}" stroke="${COL.line}" stroke-width="1"/><text x="${l-4}" y="${Y(d)+3}" text-anchor="end" font-size="9" fill="${COL.muted}" font-family="var(--f-mono)">${d}</text>`}

function syncInputs(){const act=document.activeElement;
  for(const [id,v] of [["rX",P.rec.x],["rY",P.rec.y],["rZ",P.rec.z],["dL",P.room.L],["dW",P.room.W],["dH",P.room.H]])if($(id)!==act)$(id).value=+(+v).toFixed(2);
  document.querySelectorAll("#srcList .srcrow").forEach(row=>{const s=P.sources.find(s=>s.id===row.dataset.id);if(!s)return;row.querySelectorAll("input").forEach(inp=>{if(inp!==act)inp.value=+(+s[inp.dataset.k]).toFixed(2)})})}
for(const [id,k] of [["rX","x"],["rY","y"],["rZ","z"]]){$(id).addEventListener("input",e=>{const v=parseFloat(e.target.value);if(!isFinite(v))return;
  P.rec[k]=clampV(v,0,k==="x"?P.room.L:k==="y"?P.room.W:P.room.H);if(k==="z")fieldDirty=true;schedule()});$(id).addEventListener("change",()=>commit())}
for(const [id,k,mn,mx] of [["dL","L",3,200],["dW","W",3,200],["dH","H",2,80]]){$(id).addEventListener("change",e=>{const v=parseFloat(e.target.value);if(!isFinite(v)){syncInputs();return}
  const old=P.room[k];const nv=clampV(v,mn,mx);if(nv===old)return;resizeRoom(k,old,nv);commit();layout();renderPanel()})}
function resizeRoom(k,old,nv){P.room[k]=nv;const f=nv/old;
  if(k==="L"){for(const w of [...P.plan,...P.sec]){w.a[0]*=f;w.b[0]*=f}for(const s of P.sources)s.x*=f;P.rec.x*=f}
  if(k==="W"){for(const w of P.plan){w.a[1]*=f;w.b[1]*=f}for(const s of P.sources)s.y*=f;P.rec.y*=f}
  if(k==="H"){for(const w of P.sec){w.a[1]*=f;w.b[1]*=f}for(const s of P.sources)s.z=Math.min(s.z,nv);P.rec.z=Math.min(P.rec.z,nv)}}

/* ---------------- toolbar ---------------- */
function setPressed(ids,on){for(const id of ids)$(id).setAttribute("aria-pressed",id===on?"true":"false")}
function setTool(tl){tool=tl;setPressed(["tSelect","tWall","tSource"],{select:"tSelect",wall:"tWall",source:"tSource"}[tl]);$("hint").textContent=t({select:"hintSelect",wall:"hintWall",source:"hintSource"}[tl])}
$("tSelect").onclick=()=>setTool("select");$("tWall").onclick=()=>setTool("wall");$("tSource").onclick=()=>setTool("source");
function setMetric(m){metric=m;setPressed(["mapC","mapS","mapOff"],{clarity:"mapC",spl:"mapS",off:"mapOff"}[m]);fieldImg=null;if(m!=="off"&&!field)fieldDirty=true;schedule()}
$("mapC").onclick=()=>setMetric("clarity");$("mapS").onclick=()=>setMetric("spl");$("mapOff").onclick=()=>setMetric("off");
function setMode(m){P.mode=m;setPressed(["mSpeech","mMusic"],m==="music"?"mMusic":"mSpeech");commit()}
$("mSpeech").onclick=()=>setMode("speech");$("mMusic").onclick=()=>setMode("music");
$("showRays").onchange=e=>{showRays=e.target.checked;schedule()};$("showImg").onchange=e=>{showImg=e.target.checked;schedule()};
$("undo").onclick=undo;
function undo(){if(hist.length<2)return;hist.pop();P=clone(hist[hist.length-1]);sel=null;save();fieldDirty=true;afterLoad(false)}
function fillPresets(){$("preset").innerHTML=PRESETS.map(p=>`<option value="${p[0]}">${esc(lang==="pl"?p[1]:p[2])}</option>`).join("");$("preset").value=P.name&&PRESETS.some(p=>p[0]===P.name)?P.name:"rect"}
$("preset").onchange=e=>{const p=PRESETS.find(p=>p[0]===e.target.value);if(!p)return;P=p[3]();P.name=p[0];sel=null;afterLoad(true)};
function afterLoad(push){for(const o of [...P.plan,...P.sec,...P.sources]){const n=parseInt(String(o.id).slice(1));if(n>=uidN)uidN=n+1}
  if(push){hist.push(clone(P));save()}fieldDirty=true;field=null;setPressed(["mSpeech","mMusic"],P.mode==="music"?"mMusic":"mSpeech");
  fillPresets();layout();renderPanel();renderSel();schedule()}

/* project menu */
$("copyJson").onclick=async()=>{$("projMenu").open=false;const txt=JSON.stringify(P,null,1);
  try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(e){showJsonBox(txt,false);toast(t("copyFail"))}};
$("pasteJson").onclick=()=>{$("projMenu").open=false;showJsonBox("",true)};
$("resetBtn").onclick=()=>{$("projMenu").open=false;P=rectPreset();sel=null;afterLoad(true)};
$("fileIn").onchange=e=>{const f=e.target.files[0];$("projMenu").open=false;if(!f)return;const rd=new FileReader();rd.onload=()=>{loadText(String(rd.result))};rd.readAsText(f);e.target.value=""};
function loadText(txt){try{let p,msg=t("loaded");const s=txt.trim();
    if(s.startsWith("{")){p=JSON.parse(s);if(!validProject(p))throw 0;for(const w of [...p.plan,...p.sec])w.id=w.id||uid("w");for(const x of p.sources)x.id=x.id||uid("s")}
    else{const r=parsePak(s);p=r.p;msg=t("pakScale").replace("{k}",r.k.toFixed(1))}
    P=p;sel=null;afterLoad(true);toast(msg)}catch(err){toast(t("loadErr"))}}
function showJsonBox(txt,editable){let box=$("jsonBox");if(box)box.remove();box=document.createElement("div");box.id="jsonBox";box.className="card";
  box.innerHTML=`<h2><span>JSON</span></h2>${editable?`<p class="empty">${t("paste")}</p>`:""}<textarea class="json" id="jsonTa" aria-label="JSON"></textarea>
  <div style="display:flex;gap:8px;margin-top:8px">${editable?`<button class="btn primary" id="jsonLoad">${t("load")}</button>`:""}<button class="btn" id="jsonClose">${t("cancel")}</button></div>`;
  document.querySelector(".panel").prepend(box);const ta=$("jsonTa");ta.value=txt;ta.focus();if(!editable)ta.select();
  $("jsonClose").onclick=()=>box.remove();if(editable)$("jsonLoad").onclick=()=>{loadText(ta.value);box.remove()}}
let toastT;function toast(msg){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}

/* language */
function applyLang(l){lang=l;document.documentElement.lang=l;setPressed(["lPL","lEN"],l==="pl"?"lPL":"lEN");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});$("modelBody").innerHTML=t("model");
  fillPresets();setTool(tool);renderPanel();renderSel();save();schedule()}
$("lPL").onclick=()=>applyLang("pl");$("lEN").onclick=()=>applyLang("en");

/* keyboard */
document.addEventListener("keydown",e=>{const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo();return}
  if(e.key==="Delete"||e.key==="Backspace"){if(sel){e.preventDefault();deleteSel()}return}
  if(e.key==="Escape"){sel=null;vPlan.draw0=vSec.draw0=null;setTool("select");renderSel();schedule();return}
  const k=e.key.toLowerCase();if(k==="v")setTool("select");else if(k==="w")setTool("wall");else if(k==="s")setTool("source")});
document.addEventListener("click",e=>{const m=$("projMenu");if(m.open&&!m.contains(e.target))m.open=false});

/* theme changes */
const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener?.("change",()=>{readColors();schedule()});
new MutationObserver(()=>{readColors();schedule()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
new ResizeObserver(()=>{layout();schedule()}).observe(document.querySelector(".views"));
document.fonts?.ready.then(()=>schedule());

/* boot */
try{const l=localStorage.getItem("echogram.lang");if(l==="en"||l==="pl")lang=l}catch(e){}
let stored=null;try{stored=JSON.parse(localStorage.getItem("echogram.project")||"null")}catch(e){}
P=validProject(stored)?stored:rectPreset();
readColors();hist.push(clone(P));applyLang(lang);afterLoad(false);
})();
</script>

</body></html>
